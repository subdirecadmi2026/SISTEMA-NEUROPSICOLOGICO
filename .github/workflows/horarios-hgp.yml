name: Horarios HGP CI

on:
  push:
    paths:
      - 'horarios-hgp/**'
      - '.github/workflows/horarios-hgp.yml'
  pull_request:
    paths:
      - 'horarios-hgp/**'
      - '.github/workflows/horarios-hgp.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: horarios-hgp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: horarios-hgp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
